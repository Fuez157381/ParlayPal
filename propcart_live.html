var data=cands().slice(0,70).map(function(x){return x.n+' | '+x.t+' | '+x.s+' | suggested bar '+x.thr+' | last games '+x.v.join(',')+(x.opp?' | '+x.hv+' '+x.opp+' '+(x.f>=1.08?'soft':x.f<=0.92?'tough':'even')+' matchup':'')+(x.bl>=2?' | BLOWOUT RISK (favorite about '+x.wpx+'% to win)':'')}).join('\n');
var cart=S.cart.map(function(c){return c.n+' '+c.bar+'+ '+ST[c.s]}).join('; ')||'empty';
var hist=S.chat.slice(-7,-1).map(function(m){return (m.r==='u'?'User: ':'Assistant: ')+m.t}).join('\n');
var prompt='You are the assistant inside PropCart, an app that builds NBA player-prop parlays from steady stats. Reply with ONLY a JSON object: {"reply":"short friendly text","actions":[...]}. Allowed actions: {"op":"add","player":"exact name","stat":"pts|reb|ast|tpm","bar":number}, {"op":"remove","player":"exact name","stat":"optional"}, {"op":"clear"}, {"op":"stake","amount":number}, {"op":"platform","name":"Kalshi|Hard Rock|DraftKings|FanDuel|PrizePicks|Sleeper"}. Rules: only use players and stats listed in DATA. Use the suggested bar unless the user asks for safer or riskier (a bar is "over this many"; keep it at or below the player\'s lowest recent game; a riskier bar can go up to their average). Use one leg per player and at most 3 legs per team unless the user insists. To change a parlay, remove or add legs. Avoid legs flagged BLOWOUT RISK unless the user insists, since starters sit in blowouts. Never promise a win; samples are only 1-3 games, so say so briefly when it matters. Keep the reply under 70 words.\nDATA (best first):\n'+data+'\nCURRENT CART: '+cart+'\nRECENT CHAT:\n'+hist+'\nUSER REQUEST: '+text;
var reply,sum='';
try{var res=await AI(prompt,{cache:false}),o=parse(res.text||'');reply=o.reply||'Done.';var a=apply(o.actions);sum=a.join('. ')}
catch(e){reply=e&&e.code==='not_granted'?'I need permission to run. Reload the page and choose Allow when it asks.':e&&e.code==='rate_limited'?'Too many requests at once. Wait a minute and try again.':'Something went wrong. Try asking again.'}
S.busy=0;S.chat.push({r:'a',t:reply,a:sum});$('cc').textContent=S.cart.length;msgs()}
document.addEventListener('click',function(e){
if(e.target.id==='mdl'){S.pm=null;vP();return}var b=e.target.closest('button');if(!b)return;var d=b.dataset,id=b.id;
if(d.sf){if(d.sf==='l')S.sl=+d.v;else if(d.sf==='s')S.ss=d.v;else S.mp=+d.v;view();return}
if(d.sc){S.sc[d.sc]=S.sc[d.sc]?0:1;view();return}
if(id==='sa'){(S.sres||[]).forEach(addCart);save();S.tab='cart';view();window.scrollTo(0,0);return}
if(d.p){S.pm={n:d.p,s:'reb'};vP();return}
if(d.ps){S.pm.s=d.ps;vP();return}
if(id==='pmx'){S.pm=null;vP();return}
if(d.pa){addLeg(findP(S.pm.n),S.pm.s,+d.pa);$('cc').textContent=S.cart.length;if(S.tab==='props')plist();b.textContent='Added';return}
if(d.t){S.tab=d.t;view();window.scrollTo(0,0);return}
if(d.g){if(S.sel[d.g])delete S.sel[d.g];else S.sel[d.g]=1;view();return}
if(id==='sg'&&b.textContent==='Select all'){G.forEach(function(g){S.sel[g.i]=1});view();return}
if(id==='cg'){S.sel={};view();return}
if(id==='sp'){S.tab='props';view();window.scrollTo(0,0);return}
if(d.f){S.f=d.f;view();return}
if(d.k){if(inCart(d.k))S.cart=S.cart.filter(function(c){return c.k!==d.k});else if(M[d.k])addCart(M[d.k]);save();$('cc').textContent=S.cart.length;if(S.tab==='safe')view();else plist();return}
if(id==='ab5'){var c5=cands().filter(function(x){return S.f==='all'||x.s===S.f});auto(c5,5).forEach(addCart);save();$('cc').textContent=S.cart.length;plist();return}
if(id==='ab'){S.cart=[];auto(cands(),5).forEach(addCart);save();view();return}
if(d.c!==undefined){var it=S.cart[+d.c],stp=it.s==='pts'?5:1,dr=+d.d,nb=dr>0?(Math.floor(it.bar/stp)+1)*stp:(Math.ceil(it.bar/stp)-1)*stp;it.bar=Math.max(1,nb);save();view();return}
if(d.rm!==undefined){S.cart.splice(+d.rm,1);save();view();return}
if(id==='clr'){S.cart=[];save();view();return}
if(d.q){ask(d.q);return}
if(id==='snd'){var qi=$('qi'),t=qi.value;qi.value='';ask(t);return}
if(id==='ad'){var n=$('an').value.trim();if(!n){alert('Enter a player name.');return}
var nums=function(i){return $(i).value.split(/[,\s]+/).map(parseFloat).filter(function(x){return !isNaN(x)})},f={pts:nums('ap'),reb:nums('ar'),ast:nums('aa'),tpm:nums('a3')};
if(!f.pts.length&&!f.reb.length&&!f.ast.length&&!f.tpm.length){alert('Enter at least one stat.');return}
var p=D.filter(function(x){return norm(x.n)===norm(n)})[0];if(!p){p={n:n,t:'',pts:[],reb:[],ast:[],tpm:[]};D.push(p)}
var tm=$('at').value.trim();if(tm)p.t=tm.toUpperCase();Object.keys(f).forEach(function(s){if(f[s].length)p[s]=f[s]});
['an','at','ap','ar','aa','a3'].forEach(function(i){$(i).value=''});save();plist();return}
if(id==='rd'){if(confirm('Replace your players with the starting data?')){D=SEED.slice();save();plist()}}
});
document.addEventListener('input',function(e){var t=e.target;
if(t.id==='ms'){S.m=+t.value;$('mv').textContent=t.value;plist()}
else if(t.classList.contains('od')){S.cart[+t.dataset.i].odds=t.value;save();$('sum').innerHTML=payout()}
else if(t.id==='sk'){S.stake=t.value;$('sum').innerHTML=payout()}
else if(t.id==='cb'){S.combo=t.value;$('sum').innerHTML=payout()}
else if(t.id==='mu'){S.mult=t.value;$('sum').innerHTML=payout()}
else if(t.id==='qs'){S.q=t.value;plist()}
else if(t.dataset.sp){S.sp[t.dataset.sp]=Math.abs(parseFloat(t.value))||0}
else if(t.dataset.pb){S.pr[t.dataset.pk+'|'+t.dataset.pb]=t.value;var pp=findP(S.pm.n),vv=pp[S.pm.s]||[];$('vd'+t.dataset.pb).textContent=verdict(vv.filter(function(n){return n>=+t.dataset.pb}).length,vv.length,t.value)}});
document.addEventListener('change',function(e){var t=e.target;
if(t.id==='gn'){S.g=+t.value;plist()}
else if(t.id==='pt'){var pp=PL.filter(function(p){return p[0]===t.value})[0],ot=S.pt;S.pl=pp[0];S.pt=pp[1];if(ot!==S.pt)S.cart.forEach(function(c){c.odds=''});view()}
else if(t.id==='ph'){onPhoto(t.files&&t.files[0])}});
document.addEventListener('keydown',function(e){if(e.target.id==='qi'&&e.key==='Enter'){e.preventDefault();var t=e.target.value;e.target.value='';ask(t)}});

var LIVE=null,PID={},LDATE='',DATES=[];
function banner(){var e=$('lv');if(!e)return;if(!LIVE){e.style.color='var(--mu)';e.textContent='Loading live NBA data...';return}
if(LIVE.err){e.style.color='var(--bad)';e.textContent='Live NBA data unavailable ('+LIVE.err+'). If the black window is closed, start it again with: python server.py';return}
if(LIVE.note){e.style.color='var(--pur2)';e.textContent=LIVE.note;return}
e.style.color='var(--ok)';e.textContent='Live NBA data for '+LIVE.date+': '+LIVE.games+' games, '+LIVE.teams+' teams, '+LIVE.players+' players, '+(LIVE.logs_current_season+LIVE.logs_previous_season)+' game logs ('+LIVE.logs_current_season+' this season, '+LIVE.logs_previous_season+' previous). Updated '+String(LIVE.updated).slice(0,16).replace('T',' ')+'.'}
function dpSet(v){if(v)loadLive(v)}
function dpStep(dir){var cur=LDATE,t=null,i;if(!cur)return;
if(DATES.length){if(dir>0){for(i=0;i<DATES.length;i++)if(DATES[i]>cur){t=DATES[i];break}}else{for(i=DATES.length-1;i>=0;i--)if(DATES[i]<cur){t=DATES[i];break}}}
else{var d=new Date(cur+'T12:00:00');d.setDate(d.getDate()+dir);t=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
if(t)loadLive(t)}
function loadLive(date){LIVE=null;banner();fetch('/api/data'+(date?'?date='+encodeURIComponent(date):'')).then(function(r){return r.json()}).then(function(j){
if(j.error)throw new Error(j.error);
DATES=j.dates||[];LDATE=j.stats.date;var di=$('dpi');if(di)di.value=LDATE;
if(!j.games.length){G=[];D=[];WP={};S.sel={};LIVE={note:'No NBA games on '+LDATE+'. Use the arrows to jump to a day with games.'};banner();view();return}
if(!j.players||!j.players.length)throw new Error('games found but no players returned');
j.players.forEach(function(p){PID[p.n]=p.id});D=j.players.map(function(p){return{n:p.n,t:p.t,pts:p.pts,reb:p.reb,ast:p.ast,tpm:p.tpm}});
G=j.games;OPP=j.opp||{};WHY=j.why||{};WP={};S.sel={};G.forEach(function(g){S.sel[g.i]=1});LIVE=j.stats;banner();view()
}).catch(function(e){LIVE={err:String(e&&e.message||e)};banner()})}
function localAsk(t){
var s=norm(t),acts=[],n=5,m=s.match(/(\d+)\s*-?\s*(leg|pick|prop)/)||s.match(/\b(\d{1,2})\b/);if(m&&+m[1]>0&&+m[1]<=20)n=+m[1];
var cats=[];if(/three|3pt|\b3s\b/.test(s))cats.push('tpm');if(/rebound|board/.test(s))cats.push('reb');if(/assist/.test(s))cats.push('ast');if(/point|pts|scor/.test(s))cats.push('pts');
var nm=D.filter(function(p){var q=norm(p.n);return s.indexOf(q)>-1||q.split(' ').some(function(w){return w.length>4&&(' '+s+' ').indexOf(' '+w+' ')>-1})}).map(function(p){return p.n});
var pq=PL.filter(function(p){return s.indexOf(norm(p[0]))>-1})[0];if(pq){S.pl=pq[0];S.pt=pq[1];acts.push('Platform: '+pq[0])}
var sk=s.match(/(?:stake|bet|wager)\D{0,6}(\d+(?:\.\d+)?)/);if(sk){S.stake=+sk[1];acts.push('Stake: $'+S.stake)}
var reply='';
if(/(clear|empty|reset)/.test(s)&&/(cart|parlay)/.test(s)){S.cart=[];reply='Cart cleared.'}
else if(/(remove|drop|delete|take out)/.test(s)){var b=S.cart.length;
if(/(riskiest|weakest|worst|least safe)/.test(s)&&b){var w=S.cart.reduce(function(a,x){return est(x)<est(a)?x:a});S.cart=S.cart.filter(function(x){return x!==w});acts.push('Removed '+w.n+' '+w.bar+'+ '+ST[w.s])}
else if(nm.length)S.cart=S.cart.filter(function(x){return nm.indexOf(x.n)<0});
else if(cats.length)S.cart=S.cart.filter(function(x){return cats.indexOf(x.s)<0});
reply=S.cart.length<b?'Done.':'I couldn’t tell which leg to remove. Name a player or a category.'}
else if(/\b(parlay|build|make|find|give|add|safe|conservative|consistent|legs?|picks?)\b/.test(s)){
var c=cands().filter(function(x){return (!cats.length||cats.indexOf(x.s)>-1)&&(!nm.length||nm.indexOf(x.n)>-1)&&est(x)>=0.7});
c.sort(function(a,b){return est(b)-est(a)||b.sc-a.sc});
var used={},tc={},cap=Math.max(3,Math.ceil(n/4)),k=0;S.cart.forEach(function(x){used[x.n]=1});
c.forEach(function(x){if(k>=n||used[x.n]||(tc[x.t]||0)>=cap)return;used[x.n]=1;tc[x.t]=(tc[x.t]||0)+1;if(!inCart(x.key)){addCart(x);k++;acts.push('Added '+x.n+' '+x.thr+'+ '+ST[x.s]+' (est. '+Math.round(est(x)*100)+'%)')}});
reply=k?'Added '+k+' leg'+(k>1?'s':'')+(k<n?'. Only '+k+' qualified at 70%+, so that’s all I added':'')+'. Estimates come from each player’s logged games, not market prices, and none are guaranteed.':'Nothing qualifies at 70%+ for that request with the games logged. I won’t pad the cart.'}
else reply=acts.length?'Done.':'Try: “5-leg parlay with rebounds and threes”, “remove the riskiest leg”, “stake 10 on Kalshi”.';
save();return{reply:reply,a:acts.join('. ')}}

view();loadLive();
(async function(){try{if(window.claude&&claude.use)AI=await claude.use('sample')}catch(e){AI=null}if(S.tab==='ai')view()})();
