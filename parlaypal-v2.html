<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parlay Pal · NBA prop research</title>
<meta name="description" content="Free NBA player-prop research. Every line checked against real apps, every pick graded from real box scores.">
<meta name="theme-color" content="#06070B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.css">
<style>
/* Parlay Pal v2 "Arena". Contract: night-game scoreboard. Purple + sky are the brand, lime = hit, rose = miss. Barlow Condensed for every number. */
:root{
  --bg:#06070B;--bg2:#0A0D16;--card:#0E121D;--card2:#141928;--card3:#1B2133;--line:#1E2436;--line2:#2B3249;
  --ink:#F1F3FA;--mu:#9CA4BE;--mu2:#6E7692;
  --pur:#A78BFA;--pur2:#C4B5FD;--sky:#7DD3FC;--lime:#A3E635;--rose:#FB7185;--amber:#FBBF24;
  --glass:rgba(12,15,26,.72);
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;--rs:10px;--ease:cubic-bezier(.22,1,.36,1);
  --rail:84px;--dock:340px;--tab:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--body);min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
.num,.disp{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}

/* arena lights: two slow beams behind everything */
.lights{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.lights i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.22}
.lights i:nth-child(1){left:-20vmax;top:-30vmax;background:radial-gradient(circle,var(--pur),transparent 62%)}
.lights i:nth-child(2){right:-25vmax;top:-20vmax;background:radial-gradient(circle,var(--sky),transparent 62%);opacity:.14}
.lights:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0,var(--bg) 520px)}

/* rail (desktop) / tab bar (phone) */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:rgba(6,7,11,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:grid;place-items:center;width:52px;height:52px;margin-bottom:14px;border:0;border-radius:14px;background:linear-gradient(140deg,var(--pur),var(--sky));color:#0A0614;font:800 24px/1 var(--disp);letter-spacing:-.02em}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:68px;height:60px;border:0;border-radius:12px;background:none;color:var(--mu2);font:600 11.5px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;transition:color .2s,background .2s}
.tab:hover{color:var(--ink);background:var(--card)}
.tab[aria-current=page]{color:var(--ink);background:var(--card2)}
.tab[aria-current=page]:before{content:"";position:absolute;left:-8px;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(var(--pur),var(--sky))}
.tab .bd{position:absolute;top:6px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--lime);color:#0B1200;font:800 12px/18px var(--disp);text-align:center}
.paltab[aria-expanded=true]{color:var(--ink);background:var(--card2)}.paltab svg{color:var(--pur2)}
.rail .sp{flex:1}
.me{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font:700 16px/1 var(--disp);display:grid;place-items:center;overflow:hidden;padding:0}
.me img{width:100%;height:100%;object-fit:cover}
.me2{display:none;width:40px;height:40px}

.shell{margin-left:var(--rail);padding:0 28px 80px;max-width:1440px}
@media (min-width:1240px){.shell{margin-right:var(--dock)}}

/* top strip: days + search */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:68px;margin:0 -28px;padding:0 28px;background:var(--glass);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.days{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.day{flex:none;height:38px;padding:0 14px;border:1px solid transparent;border-radius:10px;background:none;color:var(--mu);font:600 15px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.day:hover{color:var(--ink);background:var(--card)}
.day[aria-pressed=true]{color:var(--ink);background:var(--card2);border-color:var(--line2)}
.srch{position:relative;width:min(300px,34vw)}
.srch input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--card);padding:0 14px 0 38px;font-size:15px}
.srch input:focus{border-color:var(--pur);outline:none}
.srch svg{position:absolute;left:12px;top:11px;color:var(--mu2)}
.srch .res{position:absolute;top:46px;left:0;right:0;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.6);max-height:60vh;overflow:auto}
.srch .res button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:8px;background:none;text-align:left}
.srch .res button:hover{background:var(--card3)}
.srch .res small{color:var(--mu);margin-left:auto;font-size:12.5px}

/* shared atoms */
.kick{display:inline-flex;align-items:center;gap:8px;font:700 13px/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--sky)}
.shiny{background:linear-gradient(100deg,var(--sky) 0 40%,#fff 50%,var(--sky) 60% 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4.5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.h2{margin:0;font:800 30px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.sec{margin-top:44px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sech p{margin:6px 0 0;color:var(--mu);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--pur),#8B6CF6);color:#0B0618;font:800 16px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:transform .2s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:disabled{background:var(--card3);color:var(--mu2);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--pur)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.lnk{border:0;background:none;padding:0;color:var(--sky);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;background:var(--card);color:var(--mu);font:600 14px/1 var(--disp);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;flex:none}
.chip:hover{color:var(--ink);border-color:var(--mu2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4}
.chip img{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.logo{width:22px;height:22px;object-fit:contain;flex:none}
.hs{position:relative;flex:none;width:44px;height:44px;border-radius:50%;background:var(--card3);overflow:hidden;display:grid;place-items:center;font:700 14px/1 var(--disp);color:var(--mu)}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.25) translateY(6%)}
.risk{font:700 12px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.risk.l{background:rgba(163,230,53,.14);color:var(--lime)}.risk.m{background:rgba(125,211,252,.14);color:var(--sky)}.risk.h{background:rgba(251,191,36,.14);color:var(--amber)}.risk.e{background:rgba(251,113,133,.16);color:var(--rose)}
.empty{padding:48px 20px;text-align:center;color:var(--mu);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font:700 22px/1.2 var(--disp);text-transform:uppercase;margin-bottom:6px}
.skel{border-radius:12px;background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
/* spotlight card (React Bits idea): a soft light follows the pointer */
.spot{position:relative;isolation:isolate}
.spot:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(167,139,250,.14),transparent 70%);z-index:-1}
@media (hover:hover){.spot:hover:after{opacity:1}}

/* TONIGHT: a glowing stage. Light rings, sparkles and one floating object (Pal's ticket) */
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:32px;margin:0 -28px;padding:64px 28px 36px;min-height:620px;overflow:hidden;
  background:radial-gradient(50% 62% at 72% 44%,rgba(124,92,250,.42) 0%,rgba(52,38,140,.3) 32%,rgba(10,13,22,0) 68%)}
.hglow{position:absolute;inset:0;z-index:-1;pointer-events:none}
.rg{position:absolute;left:72%;top:44%;border-radius:50%;translate:-50% -50%}
.r0{width:440px;height:440px;background:conic-gradient(from 0deg,transparent 0 10%,rgba(196,181,253,.95) 22%,transparent 34%,transparent 60%,rgba(125,211,252,.85) 72%,transparent 84%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 69%,transparent 70.5%);mask:radial-gradient(circle,transparent 63%,#000 64.5%,#000 69%,transparent 70.5%);filter:blur(1px) drop-shadow(0 0 16px rgba(167,139,250,.9))}
.r1{width:530px;height:530px;border:1px solid rgba(196,181,253,.28);box-shadow:0 0 90px 10px rgba(124,92,250,.25),inset 0 0 90px rgba(124,92,250,.2)}
.r2{width:780px;height:780px;border:1px solid rgba(125,211,252,.14)}
.r3{width:1120px;height:1120px;border:1px solid rgba(196,181,253,.08)}
.beam{position:absolute;left:72%;top:44%;width:280px;height:280px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(125,211,252,.35),transparent 70%);filter:blur(30px)}
.sparks{position:absolute;inset:0;z-index:-1;pointer-events:none}
.sparks i{position:absolute;color:#fff;filter:drop-shadow(0 0 6px rgba(196,181,253,.95))}
.sparks svg{display:block;width:100%;height:100%}
.hcopy{position:relative}
.flap{display:block;margin:14px 0 0;font:800 clamp(56px,6.8vw,108px)/.9 var(--disp);letter-spacing:-.005em;text-transform:uppercase;color:#fff}
.flap .w{display:inline-block}
.flap .h1b{color:var(--pur2)}
.flap .h1b .w{background:linear-gradient(100deg,var(--pur2),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.04em}
.lede{max-width:480px;margin:18px 0 0;color:var(--mu);font-size:17px;line-height:1.55}
.hcta{display:flex;align-items:center;gap:18px;margin-top:26px;flex-wrap:wrap}
.hobj{position:relative;display:flex;justify-content:center;perspective:1100px}
.hticket{width:min(370px,100%);padding:16px;border-radius:24px;background:linear-gradient(155deg,rgba(196,181,253,.2),rgba(20,25,40,.55) 45%,rgba(125,211,252,.1));border:1px solid rgba(196,181,253,.3);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:0 50px 120px -24px rgba(91,60,220,.75),inset 0 1px 0 rgba(255,255,255,.25);transform-style:preserve-3d;will-change:transform}
.htk-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.htk-h span{font:700 13px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}.htk-h b{font:700 14px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.htk-l{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;border-radius:14px;background:rgba(6,7,11,.5);border:1px solid rgba(255,255,255,.06)}
.htk-l div{flex:1;min-width:0}.htk-l b{display:block;font:700 18px/1.1 var(--disp);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.htk-l span{font-size:13px;color:var(--mu)}
.htk-l em{font:800 24px/1 var(--disp);font-style:normal;color:var(--lime)}
.htk-f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 6px 2px}
.htk-f small{display:block;color:var(--mu);font:700 11px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase}.htk-f b{font:800 34px/1.05 var(--disp);color:#fff}
.htk-e{margin:6px 6px 10px;color:var(--mu);font-size:15px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.stat{padding:16px 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,rgba(20,25,40,.8),rgba(14,18,29,.8))}
.stat b{display:block;font:800 44px/1 var(--disp)}
.stat span{color:var(--mu);font-size:13.5px}
.stat.p b{color:var(--pur2)}.stat.s b{color:var(--sky)}.stat.l b{color:var(--lime)}
.ticker{position:relative;margin:24px -28px 0;overflow:hidden;border-block:1px solid var(--line);background:var(--bg2);-webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:10px;width:max-content;padding:12px 0;will-change:transform}
.gm{display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);flex:none;color:var(--ink)}
.gm:hover{border-color:var(--line2)}
.gm .tm{display:flex;align-items:center;gap:8px;font:700 20px/1 var(--disp)}
.gm .tm img{width:28px;height:28px}
.gm .at{color:var(--mu2);font:600 14px/1 var(--disp)}
.gm .tt{margin-left:6px;padding-left:12px;border-left:1px solid var(--line2);color:var(--mu);font:600 14px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase;text-align:right}
/* Pal's five */
.five{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.fl{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:40px 44px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;transition:border-color .2s}
.fr:hover{border-color:var(--line2)}
.fr .rk{font:800 34px/1 var(--disp);color:var(--line2)}
.fr .who b{display:block;font:700 19px/1.1 var(--disp);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .who span{color:var(--mu);font-size:14px}
.fr .pc{text-align:right}.fr .pc b{display:block;font:800 30px/1 var(--disp);color:var(--lime)}.fr .pc small{color:var(--mu2);font-size:12px}
.add{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);color:var(--ink);transition:background .2s,transform .2s var(--ease)}
.add:hover{border-color:var(--pur)}
.add[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:#0B1200}
.scorecard{position:sticky;top:90px;padding:20px;border:1px solid var(--line2);border-radius:18px;background:radial-gradient(120% 80% at 50% 0,rgba(167,139,250,.18),transparent 60%),var(--card)}
.ring{position:relative;width:150px;height:150px;margin:6px auto 10px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{display:block;font:800 46px/1 var(--disp)}.ring .v small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.scorecard h3{margin:0;font:800 22px/1 var(--disp);text-transform:uppercase;text-align:center}
.scorecard p{margin:8px 0 16px;color:var(--mu);font-size:14px;text-align:center}
.scorecard .btn{width:100%}
/* streaks + injuries */
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sk2{padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer}
.sk2 .top2{display:flex;align-items:center;gap:12px}
.sk2 .top2 b{display:block;font:700 18px/1.1 var(--disp)}.sk2 .top2 span{color:var(--mu);font-size:13.5px}
.sk2 .run{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.sk2 .run b{font:800 40px/1 var(--disp);color:var(--lime)}.sk2 .run span{color:var(--mu);font-size:13.5px}
.dots{display:flex;gap:3px;margin-top:10px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--card3)}.dots i.h{background:var(--lime)}.dots i.m{background:rgba(251,113,133,.55)}
.inj{display:flex;flex-direction:column}
.inj div{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.inj div:first-child{border-top:0}
.inj b{font:700 17px/1.1 var(--disp)}.inj span{color:var(--mu);font-size:13.5px}
.inj em{margin-left:auto;font:700 12px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;font-style:normal;padding:4px 7px;border-radius:5px;background:rgba(251,113,133,.16);color:var(--rose)}
.inj em.q{background:rgba(251,191,36,.14);color:var(--amber)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.how div{padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.how b{display:block;font:800 40px/1 var(--disp);color:var(--line2)}
.how h4{margin:8px 0 4px;font:700 20px/1.1 var(--disp);text-transform:uppercase}
.how p{margin:0;color:var(--mu);font-size:14.5px}

/* BOARD */
.bhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:30px 0 14px}
.bhead .h2{font-size:40px}
.bfil{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.note{color:var(--mu);font-size:13.5px;margin:0 0 14px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(0,1fr) 150px 70px 40px;align-items:center;gap:16px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;transition:border-color .2s}
.row:hover{border-color:var(--line2)}
.row .who b{display:block;font:700 19px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13.5px}
.row .who .logo{width:16px;height:16px}
.row .ln b{display:block;font:800 22px/1 var(--disp)}.row .ln span{color:var(--mu);font-size:13px;display:flex;gap:8px;align-items:center;margin-top:3px}
.strip{display:flex;align-items:flex-end;gap:3px;height:34px}
.strip i{flex:1;border-radius:2px 2px 0 0;background:rgba(251,113,133,.5);min-height:3px}
.strip i.h{background:var(--lime)}
.row .pc{text-align:right}.row .pc b{display:block;font:800 26px/1 var(--disp)}.row .pc small{color:var(--mu2);font-size:12px}
.more{display:block;margin:18px auto 0}

/* SLIP */
.slipw{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;padding-top:30px}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.leg .who b{display:block;font:700 18px/1.15 var(--disp)}
.leg .who span{color:var(--mu);font-size:13.5px}
.leg .ctl{display:flex;align-items:center;gap:6px}

}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HAS_G=typeof window.gsap!=='undefined';
if(!RM&&HAS_G)document.documentElement.classList.add('mo');

/* ---------- teams ---------- */
const ST={pts:'points',reb:'rebounds',ast:'assists',tpm:'3-Pointers'};
const STS={pts:'PTS',reb:'REB',ast:'AST',tpm:'3PM'};
const CATS=['pts','reb','ast','tpm'],STEP={pts:5,reb:1,ast:1,tpm:1};
const TEAMS={ATL:'Hawks',BOS:'Celtics',BKN:'Nets',CHA:'Hornets',CHI:'Bulls',CLE:'Cavaliers',DAL:'Mavericks',DEN:'Nuggets',DET:'Pistons',GSW:'Warriors',HOU:'Rockets',IND:'Pacers',LAC:'Clippers',LAL:'Lakers',MEM:'Grizzlies',MIA:'Heat',MIL:'Bucks',MIN:'Timberwolves',NOP:'Pelicans',NYK:'Knicks',OKC:'Thunder',ORL:'Magic',PHI:'76ers',PHX:'Suns',POR:'Trail Blazers',SAC:'Kings',SAS:'Spurs',TOR:'Raptors',UTA:'Jazz',WAS:'Wizards'};
const ESPN={GSW:'gs',NYK:'ny',NOP:'no',SAS:'sa',UTA:'utah',WAS:'wsh'};
const TCOL={ATL:'#E03A3E',BOS:'#007A33',BKN:'#777D84',CHA:'#1D8CAB',CHI:'#CE1141',CLE:'#860038',DAL:'#00538C',DEN:'#FEC524',DET:'#C8102E',GSW:'#1D428A',HOU:'#CE1141',IND:'#FDBB30',LAC:'#C8102E',LAL:'#552583',MEM:'#5D76A9',MIA:'#98002E',MIL:'#00471B',MIN:'#236192',NOP:'#85714D',NYK:'#F58426',OKC:'#007AC1',ORL:'#0077C0',PHI:'#006BB6',PHX:'#E56020',POR:'#E03A3E',SAC:'#5A2D81',SAS:'#C4CED4',TOR:'#CE1141',UTA:'#753BBD',WAS:'#E31837'};
const APPS=['Kalshi','Hard Rock','FanDuel','PrizePicks','Underdog','Sleeper'];
const tname=t=>TEAMS[t]||t;
const logo=(t,cls)=>TEAMS[t]?`<img class="${cls||'logo'}" src="https://a.espncdn.com/i/teamlogos/nba/500/${ESPN[t]||t.toLowerCase()}.png" alt="" loading="lazy">`:'';
const ini=n=>{const w=String(n).split(' ').filter(Boolean);return((w[0]||'')[0]||'')+(w.length>1?w[w.length-1][0]:'')};
const hs=(n,id)=>`<span class="hs" aria-hidden="true">${esc(ini(n).toUpperCase())}${id?`<img alt="" loading="lazy" src="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/${esc(id)}.png&amp;w=200&amp;h=146" onerror="this.remove()">`:''}</span>`;
const short=n=>{const w=String(n).split(' ').filter(Boolean);return w.length>1?w[0][0]+'. '+w.slice(1).join(' '):n};
const pct=p=>Math.round(p*100)+'%';
const am=a=>a==null?'':(a>0?'+':'')+a;
const dec=a=>a>0?1+a/100:1+100/-a;
const toAm=d=>d<=1?null:d>=2?Math.round((d-1)*100):Math.round(-100/(d-1));
const fair=p=>{p=Math.max(.02,Math.min(.98,+p||0));return p>=.5?-Math.round(p/(1-p)*100):Math.round((1-p)/p*100)};

/* ---------- state ---------- */
const S=load('pp2',{cart:[],stake:'10',pl:'Kalshi'});
let TRK=load('pp2t',[]);
const save=()=>store('pp2',S),trkSave=()=>store('pp2t',TRK.slice(0,12));
let D=[],G=[],OPP={},WHY={},NET={},DATES=[],DAY='',TODAY='',STATS=null,LOADING=true,ERR=null;
let VIEW='tonight',ACCT=null,CANDS=null;
const BF={game:'all',cat:'all',lim:30};
const LINES={st:'idle',players:{},posted:{},byLast:{},source:'',updated:''};
const DAYC={};let DAYTOK=0;

/* ---------- the math (same brain as Parlay Pal v1) ---------- */
function wilson(h,n){const z=1.28,ph=h/n,den=1+z*z/n,c=ph+z*z/(2*n),m=z*Math.sqrt(ph*(1-ph)/n+z*z/(4*n*n));return Math.max(0,(c-m)/den)}
const fmtM=m=>(m>0?'+':'')+m.toFixed(1);
const MINREAL={pts:10,reb:4,ast:3,tpm:2},MINTREND={pts:15,reb:5,ast:4,tpm:2};
function lad(s,v){const v10=v.slice(0,10),n=v10.length||1,avg=v10.reduce((a,b)=>a+b,0)/n,mx=Math.max(...v10,0);let lo,hi;
  if(s==='pts'){lo=avg<10?5:Math.max(10,Math.round(avg*.6/5)*5);hi=Math.max(lo+5,Math.min(Math.ceil(Math.max(mx,avg*1.3)/5)*5,60))}
  else{lo=Math.max(1,Math.round(avg*.5));hi=Math.max(lo+1,Math.ceil(Math.max(mx,avg*1.4)))}return{lo,hi}}
function defLine(v){const n=v.length,k=Math.ceil(.8*n),so=v.slice().sort((a,b)=>b-a);return Math.max(1,so[k-1])}
function lnorm(n){n=String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’'.]/g,'').replace(/-/g,' ').replace(/\b(jr|sr|ii|iii|iv)\b/g,'');return n.replace(/\s+/g,' ').trim()}
function linesIndex(){LINES.byLast={};Object.keys(LINES.players).forEach(k=>{const i=k.lastIndexOf('|'),nm=k.slice(0,i),st=k.slice(i+1),w=nm.split(' '),lk=w[w.length-1]+'|'+st;(LINES.byLast[lk]=LINES.byLast[lk]||[]).push({n:nm,b:LINES.players[k]})})}
function lineAvail(p,s){if(LINES.st!=='ok'||!LINES.posted[p.t])return null;const nm=lnorm(p.n),a=LINES.players[nm+'|'+s];if(a)return a;
  const w=nm.split(' '),c=(LINES.byLast[w[w.length-1]+'|'+s]||[]).filter(x=>x.n[0]===nm[0]);return c.length===1?c[0].b:[]}
const nearest=(al,t)=>al.reduce((m,x)=>Math.abs(x-t)<Math.abs(m-t)?x:m,al[0]);
function gameOf(t){return G.find(g=>g.a===t||g.h===t)||null}
function snap(p,s){const v=(p[s]||[]).slice(0,10);if(v.length<3)return null;if(p.inj&&p.inj.s==='out')return null;
  const g=gameOf(p.t);if(!g)return null;
  const opp=g.a===p.t?g.h:g.a;let def=defLine(v),L=lad(s,v);if(def<MINREAL[s])return null;if(LINES.st==='ok'&&!LINES.posted[p.t])return null;const al=lineAvail(p,s);let unv=false,bar;
  if(al===null){unv=true;if(s==='pts')def=Math.floor(def/5)*5;def=Math.max(def,L.lo);bar=def}
  else{if(!al.length)return null;const d0=def;def=null;for(let q=al.length-1;q>=0;q--)if(al[q]<=d0){def=al[q];break}if(def==null||def<MINREAL[s])return null;L={lo:al[0],hi:al[al.length-1]};bar=def}
  const a=NET[p.t],b=NET[opp],gap=(a&&b&&a.g>=3&&b.g>=3)?Math.abs(a.m-b.m):null,mf=(b&&b.g>=3&&OPP[opp]&&OPP[opp][s]!=null)?OPP[opp][s]:null;
  return{key:p.id+'|'+s,id:p.id,n:p.n,t:p.t,s,v,dates:(p.dates||[]).slice(0,10),ncur:Math.min(p.ncur||0,10),mins:(p.min||[]).slice(0,10),
    inj:p.inj||null,opp,gid:g.id,hv:g.a===p.t?'at':'vs',bar,def,lo:L.lo,hi:L.hi,al:al||null,unv,gap,mf,na:a?a.m:null,nb:b?b.m:null,why:(WHY[opp]&&WHY[opp][s])||''}}
function analyze(x){
  const v=x.v,n=v.length,bar=x.bar,hits=v.filter(a=>a>=bar).length,avg=v.reduce((a,b)=>a+b,0)/n,mn=Math.min(...v),mx=Math.max(...v);
  let p=(hits+1)/(n+2),lo=wilson(hits,n),mult=1,rs=0,rsb=0;const flags=[],good=[];
  if(n<6){flags.push('Only '+n+' games of data.');rs+=n<4?2:1;rsb+=n<4?2:1}
  if(x.ncur<n&&x.ncur<5)flags.push('Only '+x.ncur+' of these games are from this season.');
  if(hits<n){flags.push('Missed this line in '+(n-hits)+' of '+n+' games.');rs+=1;rsb+=1}
  if(x.gap!=null){if(x.gap>=12){mult*=.92;rs+=2;flags.push('High blowout risk. The '+tname(x.t)+' ('+fmtM(x.na)+') and '+tname(x.opp)+' ('+fmtM(x.nb)+') are far apart in average margin, and starters sit in blowouts.')}
    else if(x.gap>=7){mult*=.97;rs+=1;flags.push('Some blowout risk. The '+tname(x.t)+' ('+fmtM(x.na)+') and '+tname(x.opp)+' ('+fmtM(x.nb)+') are fairly far apart in average margin.')}
    else good.push('Similar average margins, so a blowout is less likely.')}
  if(x.mf!=null){if(x.mf<=.93){mult*=.96;rs+=1;flags.push('Tough matchup. The '+tname(x.opp)+' have allowed fewer '+ST[x.s]+' than most teams.')}else if(x.mf>=1.07)good.push('Soft matchup. The '+tname(x.opp)+' have allowed more '+ST[x.s]+' than most teams.')}
  const m5=(x.mins||[]).slice(0,5).filter(a=>typeof a==='number');
  if(m5.length>=3){const amn=m5.reduce((a,b)=>a+b,0)/m5.length;if(amn<18){mult*=.95;rs+=1;flags.push('Low minutes, about '+Math.round(amn)+' per game.')}else if(Math.min(...m5)<12){rs+=1;flags.push('Minutes have swung, with a game under 12.')}else good.push('Steady minutes, about '+Math.round(amn)+' per game.')}
  if(x.inj){mult*=.9;rs+=2;flags.unshift('Injury report: '+x.inj.t)}
  p=Math.min(.97,p*mult);lo=Math.min(lo*mult,p);
  const hr=hits/n,pen=rs-rsb;let tier=hr>=.9?0:hr>=.7?1:hr>=.4?2:3;
  if(pen>=3)tier=Math.max(tier,2);else if(pen>=2)tier=Math.max(tier,1);if(n<6)tier=Math.min(3,tier+1);if(x.inj)tier=Math.max(tier,2);
  const risk=[['Low','l'],['Moderate','m'],['High','h'],['Extreme','e']][tier];
  if(hits===0){p=Math.min(p,.01);lo=0;flags.unshift('Has not reached this line in any of these '+n+' games.')}
  const m5a=v.slice(0,5).reduce((a,b)=>a+b,0)/Math.min(5,n);
  return{n,hits,p,lo,avg,mn,mx,m5:m5a,risk:risk[0],rc:risk[1],flags,good}}
function rate(cart){if(!cart.length)return null;let pt=1,lo=1,ws=null;
  cart.forEach(c=>{const a=analyze(c);pt*=a.p;lo*=Math.min(a.lo,a.p);if(!ws||a.p<ws.a.p)ws={c,a}});
  const sc=Math.max(0,Math.min(95,Math.round(pt*100))),lab=sc>=70?['Very strong','l']:sc>=50?['Solid','l']:sc>=30?['Risky','h']:sc>=15?['Long shot','e']:['Very unlikely','e'];
  return{score:sc,low:Math.round(Math.min(lo,pt)*100),label:lab[0],tone:lab[1],ws,n:cart.length}}
const hitRun=x=>{let r=0;for(let i=0;i<x.v.length;i++){if(x.v[i]>=x.bar)r++;else break}return r};
function cands(){if(CANDS)return CANDS;const out=[];D.forEach(p=>CATS.forEach(s=>{const x=snap(p,s);if(!x)return;x.a=analyze(x);out.push(x)}));out.sort((a,b)=>b.a.p-a.a.p||b.a.avg/b.bar-a.a.avg/a.bar);return CANDS=out}
function pickN(list,n,cap){const out=[],seen={},tc={};for(const x of list){if(out.length>=n)break;if(seen[x.id]||(cap&&(tc[x.t]||0)>=cap))continue;seen[x.id]=1;tc[x.t]=(tc[x.t]||0)+1;out.push(x)}return out}
const safePool=()=>cands().filter(x=>!x.inj&&x.bar>=MINTREND[x.s]&&x.a.p>=.6);
const five=()=>pickN(safePool(),5,2);
function withBar(x,bar){if(bar==null||isNaN(bar))return x;const y=Object.assign({},x),b=x.al&&x.al.length?nearest(x.al,bar):Math.max(x.lo,Math.min(x.hi,Math.round(bar/STEP[x.s])*STEP[x.s]||bar));y.bar=b;y.key=x.key;y.a=analyze(y);return y}
const legClean=x=>{const c={};for(const k in x)if(k!=='a')c[k]=x[k];return c};

/* ---------- days + data ---------- */
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=s=>s===TODAY?'Tonight':s===addDays(TODAY||s,1)?'Tomorrow':new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function dayList(){const base=TODAY||DAY;if(!base)return[];let ds=DATES.filter(d=>d>=base).slice(0,7);if(!ds.length)for(let i=0;i<7;i++)ds.push(addDays(base,i));if(DAY&&ds.indexOf(DAY)<0)ds.unshift(DAY);return ds}
let AUTO=0;
function apply(j){const st=j.stats||{};
  if(!AUTO){AUTO=1;const nx=(j.dates||[]).filter(d=>d>(st.date||''))[0];if(!(j.games||[]).length&&st.date===st.today&&nx){TODAY=st.today;loadDay(nx);return}}
  DATES=j.dates||[];STATS=st;DAY=st.date;TODAY=st.today||TODAY||DAY;D=j.players||[];G=j.games||[];OPP=j.opp||{};WHY=j.why||{};NET=j.net||{};
  LOADING=false;ERR=null;CANDS=null;BF.game='all';BF.lim=30;renderAll(true);linesLoad()}
function loadDay(date){const tok=++DAYTOK,hit=date&&DAYC[date];if(hit&&Date.now()-hit.t<300000){apply(hit.j);return}
  LOADING=true;ERR=null;renderDays();renderView();
  fetch('/api/data'+(date?'?date='+encodeURIComponent(date):'')).then(r=>r.json()).then(j=>{if(tok!==DAYTOK)return;if(j.error)throw new Error(j.error);DAYC[j.stats.date]={j,t:Date.now()};apply(j)})
    .catch(e=>{if(tok!==DAYTOK)return;LOADING=false;ERR=String(e&&e.message||e);D=[];G=[];CANDS=null;renderAll()})}
function linesLoad(){if(!G.length){LINES.st='idle';return}const sig=G.map(g=>g.a+g.h).join(',');LINES.st='loading';LINES.sig=sig;
  fetch('/api/lines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({games:G.map(g=>({a:g.a,h:g.h}))})}).then(r=>r.json().then(j=>({j,ok:r.ok}))).then(x=>{if(LINES.sig!==sig)return;
    if(x.j&&x.j.configured===false)LINES.st='off';else if(!x.ok||x.j.error){LINES.st='err'}
    else{LINES.st='ok';LINES.players=x.j.players||{};LINES.posted=x.j.posted||{};LINES.updated=x.j.updated||'';LINES.source=x.j.source||'apps';linesIndex()}
    CANDS=null;renderAll()}).catch(()=>{if(LINES.sig!==sig)return;LINES.st='err';CANDS=null;renderAll()})}
function linesNote(){if(LINES.st==='ok'){const np=G.filter(g=>!LINES.posted[g.a]).length;return'Lines match what '+esc(LINES.source)+' really lists'+(LINES.updated?' (checked '+esc(LINES.updated)+')':'')+'.'+(np?' '+np+(np===1?' game has':' games have')+' no posted lines yet, so '+(np===1?'its':'their')+' props are hidden until apps post them.':'')}
  if(LINES.st==='loading')return'Checking which lines apps really offer…';if(LINES.st==='err'||LINES.st==='off')return'Could not check real lines right now, so these lines are estimates from recent games.';return''}

/* ---------- small renderers ---------- */
function ring(score,size,tone){const r=44,C=2*Math.PI*r,col=tone==='l'?'var(--lime)':tone==='h'?'var(--amber)':tone==='e'?'var(--rose)':'var(--pur)';
  return`<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--card3)" stroke-width="8"/><circle class="arc" cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}" data-c="${C}" data-o="${C*(1-score/100)}"/></svg>`}
function strip(x){const v=x.v.slice().reverse(),mx=Math.max(...v,x.bar)*1.08||1;return`<span class="strip" aria-hidden="true">${v.map(a=>`<i class="${a>=x.bar?'h':''}" style="height:${Math.max(8,a/mx*100)}%"></i>`).join('')}</span>`}
const inCart=k=>S.cart.some(c=>c.key===k);

const OD={sig:'',st:'idle',data:null};
function oddsKick(){const legs=S.cart.map(c=>({n:c.n,t:c.t,opp:c.opp,s:c.s,bar:c.bar})),sig=JSON.stringify(legs);if(sig===OD.sig&&OD.st!=='err'){const e=$('books');if(e)e.innerHTML=booksHtml();return}OD.sig=sig;OD.st='loading';OD.data=null;
  fetch('/api/odds',{method:'POST',headers:{'Content-Type':'application/json'},body:sig.length?JSON.stringify({legs}):'{}'}).then(r=>r.json()).then(j=>{if(OD.sig!==sig)return;OD.st=j.error?'err':'ok';OD.data=j;const e=$('books');if(e)e.innerHTML=booksHtml()}).catch(()=>{if(OD.sig!==sig)return;OD.st='err';const e=$('books');if(e)e.innerHTML=booksHtml()})}
function booksHtml(){if(OD.st==='loading')return'<div class="skel" style="height:44px;margin:6px 0"></div><div class="skel" style="height:44px"></div>';
  const bs=(OD.data&&OD.data.books||[]).slice().sort((a,b)=>(b.decimal||0)-(a.decimal||0)),stake=parseFloat(S.stake)||0;
  if(!bs.length)return`<p class="fine">${OD.st==='err'?'Prices could not be loaded right now.':'No app has priced these legs yet.'}</p>`;

/* ---------- tracker ---------- */
function track(){if(!S.cart.length)return;const t={id:Date.now(),date:DAY,stake:S.stake,legs:S.cart.map(c=>({n:c.n,t:c.t,opp:c.opp,s:c.s,bar:c.bar,pid:c.id,gid:c.gid,v:null,res:'wait'})),res:'wait',live:false,txt:''};TRK.unshift(t);trkSave();toast('Tracking it. It updates live during the games.');renderSlip();pollLive()}
function trkHtml(){if(!TRK.length)return`<div class="empty" style="padding:28px"><b style="font-size:18px">Nothing tracked yet</b>Build a slip and tap Track it live.</div>`;
  return TRK.map((t,ti)=>{const hits=t.legs.filter(l=>l.res==='hit').length,cls=t.res==='hit'?'hit':t.res==='miss'?'miss':t.live?'live':'';
    return`<div class="tcard ${t.res==='hit'?'hit':t.res==='miss'?'miss':''}"><div class="tch"><b>${t.legs.length}-leg parlay</b><span>${esc(dayLabel(t.date))} · ${hits}/${t.legs.length} hit${t.stake?' · $'+esc(t.stake):''}</span><span class="tst ${cls}">${t.res==='hit'?'Winner':t.res==='miss'?'Missed':t.live?'Live':'Upcoming'}</span></div>
    ${t.legs.map(l=>{const w=l.v==null?0:Math.min(100,Math.round(l.v/l.bar*100));return`<div class="tl ${l.res}"><span>${esc(short(l.n))} ${l.bar}+ ${STS[l.s]}</span><span class="bar"><i style="width:${w}%"></i></span><span class="v">${l.v==null?(l.res==='void'?'DNP':'–'):l.v+' / '+l.bar}</span></div>`}).join('')}
    <p style="margin:8px 0 0"><button class="lnk" type="button" data-act="trm" data-i="${ti}">Remove</button></p></div>`}).join('')}
let LIVE_T=null;
function pollLive(){clearTimeout(LIVE_T);const open=TRK.filter(t=>t.res==='wait');if(!open.length)return;const gids=[...new Set(open.flatMap(t=>t.legs.map(l=>String(l.gid))))].filter(Boolean).slice(0,12);if(!gids.length)return;
  fetch('/api/live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gids})}).then(r=>r.json()).then(j=>{const gs=j.games||{};let won=false;
    open.forEach(t=>{let live=false;t.legs.forEach(l=>{const g=gs[String(l.gid)];if(!g||g.error)return;live=live||g.status===2;const p=(g.players||{})[String(l.pid)];
        if(!p||p.played===false){if(g.status===3){l.res='void';l.v=null}return}l.v=p[l.s];l.res=l.v>=l.bar?'hit':g.status===3?'miss':'wait'});
      t.live=live;const real=t.legs.filter(l=>l.res!=='void');const before=t.res;
      t.res=real.some(l=>l.res==='miss')?'miss':real.length&&real.every(l=>l.res==='hit')?'hit':'wait';if(t.res==='hit'&&before!=='hit')won=true});
    trkSave();const e=$('trkl');if(e)e.innerHTML=trkHtml();if(won){confetti();toast('Your parlay hit! Pal is proud of you.')}}).catch(()=>{}).finally(()=>{LIVE_T=setTimeout(pollLive,30000)})}

/* ---------- slip actions ---------- */
function addLeg(x){if(inCart(x.key)){S.cart=S.cart.filter(c=>c.key!==x.key);save();refreshSlip();return}if(S.cart.length>=12){toast('That is a 12-leg max.');return}
  if(S.cart.some(c=>c.id===x.id)){S.cart=S.cart.filter(c=>c.id!==x.id)}S.cart.push(legClean(x));save();refreshSlip();bumpBadge()}
function refreshSlip(){renderDock();document.querySelectorAll('.add[data-k]').forEach(b=>{const on=inCart(b.dataset.k);if(b.getAttribute('aria-pressed')!==String(on)){const x=MAP[b.dataset.k];if(x)b.outerHTML=addBtn(x)}});if(VIEW==='slip')renderSlip()}
function bumpBadge(){if(RM||!HAS_G)return;gsap.fromTo('#cnt',{scale:1.6},{scale:1,duration:.5,ease:'back.out(3)'})}
function stepLeg(i,d){const c=S.cart[i];if(!c)return;let nb;if(c.al&&c.al.length){nb=d>0?(c.al.find(b=>b>c.bar)??c.bar):([...c.al].reverse().find(b=>b<c.bar)??c.bar)}else{const st=STEP[c.s];nb=d>0?(Math.floor(c.bar/st)+1)*st:Math.max(1,(Math.ceil(c.bar/st)-1)*st)}
  if(nb===c.bar){toast(c.al?'No app lists a line past that one.':'That is as far as it goes.');return}c.bar=nb;save();renderSlip();renderDock()}

function openPlayer(id,s){const p=findP(id);if(!p)return;PS.id=id;PS.s=s||'pts';PS.bar=null;PS.f='all';$('sheet').hidden=false;document.body.style.overflow='hidden';lenisStop(true);renderPlayer();
  if(!RM&&HAS_G){gsap.fromTo('#sheetb',{y:40,opacity:0,scale:.98},{y:0,opacity:1,scale:1,duration:.5,ease:'power3.out'});setTimeout(()=>gsap.set('#sheetb',{clearProps:'opacity,transform'}),900)}setTimeout(()=>{const c=$('sheetb').querySelector('.close');if(c)c.focus()},50)}
function closeSheet(){$('sheet').hidden=true;document.body.style.overflow='';lenisStop(false)}
function renderPlayer(){const p=findP(PS.id);if(!p)return;const s=PS.s,x0=snap(p,s),vals=(p[s]||[]).slice(0,20),mu=p.mu||[],dt=p.dates||[];
  const g=gameOf(p.t),opp=g?(g.a===p.t?g.h:g.a):'';
  let rows=vals.map((v,i)=>({v,mu:mu[i]||'',d:dt[i]||''}));
  if(PS.f==='home')rows=rows.filter(r=>/ vs\. /.test(r.mu));else if(PS.f==='away')rows=rows.filter(r=>/ @ /.test(r.mu));else if(PS.f==='h2h')rows=rows.filter(r=>opp&&r.mu.indexOf(opp)>-1);
  rows=rows.slice(0,PS.f==='all'?10:20);
  const bar=PS.bar!=null?PS.bar:x0?x0.bar:Math.max(1,Math.round((vals.slice(0,10).reduce((a,b)=>a+b,0)/Math.max(1,Math.min(10,vals.length)))||1));
  const x=x0?Object.assign({},x0,{bar}):null;if(x)x.a=analyze(x);
  const show=rows.slice().reverse(),mx=Math.max(...show.map(r=>r.v),bar,1)*1.15,hits=rows.filter(r=>r.v>=bar).length;
  const injT=p.inj?`<p style="margin-top:8px;color:var(--amber)">${esc(p.inj.s==='out'?'Listed out':'Questionable')}: ${esc(p.inj.t||'')}</p>`:'';
  $('sheetb').innerHTML=`<div class="shh" style="--tc:${TCOL[p.t]||'#7DD3FC'}"><button class="close" type="button" data-act="sheetx" aria-label="Close">&times;</button>${hs(p.n,p.id)}<h2>${esc(p.n)}</h2><p>${logo(p.t)} ${esc(tname(p.t))}${g?` · ${g.a===p.t?'at':'vs'} ${esc(tname(opp))} · ${esc(g.t||'')}`:' · no game this day'}</p>${injT}</div>
   <div class="shb"><div class="chips" role="group" aria-label="Stat">${CATS.map(c=>`<button class="chip" type="button" data-act="ps" data-s="${c}" aria-pressed="${s===c}">${c==='tpm'?'3-Pointers':ST[c][0].toUpperCase()+ST[c].slice(1)}</button>`).join('')}</div>
   <div class="chips" style="margin-top:8px" role="group" aria-label="Games">${[['all','Last 10'],['home','Home'],['away','Away'],['h2h','vs '+(opp||'opponent')]].map(f=>`<button class="chip" type="button" data-act="pf" data-f="${f[0]}" aria-pressed="${PS.f===f[0]}"${f[0]==='h2h'&&!opp?' disabled':''}>${esc(f[1])}</button>`).join('')}</div>
   ${show.length?`<div class="chart" id="chart">${show.map(r=>`<div class="c ${r.v>=bar?'h':''}"><b>${r.v}</b><i style="height:${Math.max(2,r.v/mx*100)}%"></i></div>`).join('')}<div class="lnl" style="bottom:${bar/mx*100}%"><span>${bar}+</span></div></div><div class="xl">${show.map(r=>`<span>${esc((r.mu.match(/(?:@|vs\.) (\w+)/)||[])[1]||'')}<br>${esc(r.d.slice(5).replace('-','/'))}</span>`).join('')}</div>`:'<div class="empty" style="margin-top:20px">No games match this filter.</div>'}
   <div class="sline"><div><span class="kick">Line</span><div class="step" style="margin-top:6px"><button type="button" data-act="pstep" data-d="-1" aria-label="Lower line">−</button><b class="big" style="font-size:28px;min-width:64px">${bar}+</b><button type="button" data-act="pstep" data-d="1" aria-label="Raise line">+</button></div></div>
     <div><span class="kick">Hit</span><div class="big num">${hits}/${rows.length}</div></div>${x?`<div><span class="kick">Chance</span><div class="big num" style="color:${x.a.p>=.7?'var(--lime)':x.a.p>=.5?'var(--sky)':'var(--amber)'}">${pct(x.a.p)}</div></div><span style="margin-left:auto">${(()=>{const y=reg(Object.assign(x,{key:x.key}));return S.cart.some(c=>c.key===y.key&&c.bar===y.bar)?'<button class="btn ghost" type="button" data-act="padd">On your slip</button>':'<button class="btn" type="button" data-act="padd">Add '+bar+'+</button>'})()}</span>`:''}</div>
   ${x?`<div class="facts"><div><b class="num">${x.a.avg.toFixed(1)}</b><span>avg last 10</span></div><div><b class="num">${x.a.m5.toFixed(1)}</b><span>avg last 5</span></div><div><b class="num">${x.a.mn}</b><span>lowest</span></div><div><b class="num">${x.a.mx}</b><span>highest</span></div></div>
     <ul class="flags">${x.a.good.map(t=>`<li class="g">${esc(t)}</li>`).join('')}${x.a.flags.map(t=>`<li>${esc(t)}</li>`).join('')}${x.why?`<li class="g">${esc(x.why)}</li>`:''}</ul>${x.unv?'<p class="fine">This line is an estimate: real app lines could not be checked.</p>':''}`
     :`<p class="note" style="margin-top:14px">${p.inj&&p.inj.s==='out'?'He is listed out, so he is off the board.':!g?'No game on this day.':'No line apps post for this stat, so it is not on the board.'}</p>`}</div>`;
  if(!RM&&HAS_G){gsap.from('#chart .c i',{scaleY:0,duration:.6,ease:'power3.out',stagger:.03});setTimeout(()=>gsap.set('#chart .c i',{clearProps:'transform'}),1300)}}
function pstep(d){const p=findP(PS.id),x=p&&snap(p,PS.s);let b=PS.bar!=null?PS.bar:x?x.bar:5;if(x&&x.al&&x.al.length){b=d>0?(x.al.find(v=>v>b)??b):([...x.al].reverse().find(v=>v<b)??b)}else{const st=STEP[PS.s];b=d>0?(Math.floor(b/st)+1)*st:Math.max(1,(Math.ceil(b/st)-1)*st)}PS.bar=b;renderPlayer()}
function padd(){const p=findP(PS.id),x=p&&snap(p,PS.s);if(!x)return;const y=PS.bar!=null?withBar(x,PS.bar):Object.assign(x,{a:analyze(x)});if(S.cart.some(c=>c.key===y.key&&c.bar===y.bar)){S.cart=S.cart.filter(c=>c.key!==y.key);save();refreshSlip();renderPlayer();return}
  S.cart=S.cart.filter(c=>c.id!==y.id);S.cart.push(legClean(y));save();refreshSlip();bumpBadge();renderPlayer();toast(short(y.n)+' '+y.bar+'+ '+ST[y.s]+' added.')}

/* ---------- search ---------- */
function searchRun(q){const r=$('qres');q=norm(q).trim();if(q.length<2){r.hidden=true;return}
  const ps=D.filter(p=>norm(p.n).indexOf(q)>-1||norm(tname(p.t)).indexOf(q)>-1||p.t.toLowerCase()===q).slice(0,8);
  r.innerHTML=ps.length?ps.map(p=>`<button type="button" data-act="player" data-id="${esc(p.id)}">${hs(p.n,p.id)}<b>${esc(p.n)}</b><small>${esc(p.t)}${p.inj?' · '+(p.inj.s==='out'?'out':'questionable'):''}</small></button>`).join(''):'<p class="note" style="padding:8px;margin:0">No player playing this day matches.</p>';r.hidden=false}

/* ---------- Pal ---------- */
const CHAT=load('pp2c',[{r:'a',t:"Hey, I'm Pal. Tell me what to build, like \"4 legs, only rebounds\", or ask me about any player. I only use real games and real lines."}]);
let PALBUSY=false;
const SUGG=['Build me a safe 3-leg','Rate my slip','Who is the best rebounder tonight?','Make it riskier'];
function renderChat(){$('msgs').innerHTML=CHAT.slice(-30).map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')+(PALBUSY?'<div class="msg a th">Pal is thinking <i></i><i></i><i></i></div>':'');$('msgs').scrollTop=1e6;$('sugg').innerHTML=SUGG.map(s=>`<button type="button" data-act="sugg">${esc(s)}</button>`).join('')}
function say(t,r){CHAT.push({r:r||'a',t});store('pp2c',CHAT.slice(-30));renderChat()}
function palCtx(){const slip=S.cart.map(c=>{const a=analyze(c);return{ref:c.id+':'+c.s,name:c.n,team:c.t,vs:c.opp,stat:c.s,bar:c.bar,hit:a.hits+'/'+a.n,avg:+a.avg.toFixed(1),p:Math.round(a.p*100),risk:a.risk}});
  const pool=cands().filter(x=>!x.inj&&x.a.p>=.55).slice(0,60).map(x=>({ref:x.id+':'+x.s+':'+x.bar,name:x.n,team:x.t,vs:x.opp,stat:x.s,bar:x.bar,hit:x.a.hits+'/'+x.a.n,avg:+x.a.avg.toFixed(1),p:Math.round(x.a.p*100),risk:x.a.risk}));
  const bold=[];cands().forEach(x=>{if(x.inj)return;const hb=x.al&&x.al.length?x.al.find(b=>b>x.bar):x.bar+STEP[x.s];if(hb==null)return;const y=withBar(x,hb);if(y.bar>x.bar&&y.a.p>=.38)bold.push({ref:y.id+':'+y.s+':'+y.bar,name:y.n,team:y.t,vs:y.opp,stat:y.s,bar:y.bar,hit:y.a.hits+'/'+y.a.n,avg:+y.a.avg.toFixed(1),p:Math.round(y.a.p*100)})});bold.sort((a,b)=>b.p-a.p);
  const inj=D.filter(p=>p.inj).slice(0,40).map(p=>({name:p.n,team:p.t,status:p.inj.s,note:String(p.inj.t||'').slice(0,80)})),r=rate(S.cart);
  return{day:dayLabel(DAY)+' '+DAY,date:DAY,games:G.map(g=>g.a+' at '+g.h),stake:S.stake,platform:S.pl,slip,slipScore:r?{score:r.score,label:r.label,low:r.low}:null,pool,boldPool:bold.slice(0,30),injuries:inj,placedToday:TRK.filter(t=>t.date===DAY).flatMap(t=>t.legs.map(l=>l.n)),playerPageOpen:!$('sheet').hidden&&findP(PS.id)?findP(PS.id).n:null,apps:APPS,note:'stat codes: pts points, reb rebounds, ast assists, tpm 3-Pointers. p = estimated chance to clear the bar from past games, not a betting price. No odds are included.'}}
function findByName(n){n=norm(n||'');if(!n)return null;return D.find(p=>norm(p.n)===n)||D.find(p=>norm(p.n).indexOf(n)>-1)||D.find(p=>n.indexOf(norm(p.n.split(' ').slice(-1)[0]))>-1)}
function palApply(acts){let ch=0;(acts||[]).forEach(a=>{try{
  if(a.op==='clear'){S.cart=[];ch++}
  else if(a.op==='stake'&&a.value){S.stake=String(a.value).replace(/[^0-9.]/g,'')||S.stake;ch++}
  else if(a.op==='platform'&&a.value){const m=APPS.find(x=>norm(x)===norm(a.value));if(m){S.pl=m;ch++}}
  else if(a.op==='remove'){const pr=String(a.ref||'').split(':'),p=pr[0]?findP(pr[0]):findByName(a.player);if(p){S.cart=S.cart.filter(c=>String(c.id)!==String(p.id));ch++}}
  else if(a.op==='add'){let p,s,bar;if(a.ref){const pr=String(a.ref).split(':');p=findP(pr[0]);s=pr[1];bar=pr[2]!=null?+pr[2]:null}else{p=findByName(a.player);s=a.stat;bar=a.bar!=null?+a.bar:null}
    if(!p||!CATS.includes(s))return;let x=snap(p,s);if(!x)return;x=bar!=null?withBar(x,bar):Object.assign(x,{a:analyze(x)});S.cart=S.cart.filter(c=>c.id!==x.id);if(S.cart.length<12){S.cart.push(legClean(x));ch++}}}catch(e){}});
  if(ch){save();refreshSlip();renderView()}return ch}
function palLocal(t){const s=' '+norm(t)+' ',m=s.match(/(\d{1,2}|two|three|four|five|six|seven|eight)\s*(?:-|\s)?(?:leg|pick|man)/),W={two:2,three:3,four:4,five:5,six:6,seven:7,eight:8};
  if(/rate|grade|how.*(slip|parlay)/.test(s)){const r=rate(S.cart);say(r?`Your ${r.n}-leg slip: ${r.score}% to hit all (${r.label}). Weakest: ${r.ws.c.n} ${r.ws.c.bar}+ ${ST[r.ws.c.s]} at ${pct(r.ws.a.p)}.`:'Your slip is empty. Ask me to build one.');return}
  if(m||/build|make|parlay/.test(s)){const n=m?(W[m[1]]||+m[1]):3,cat=/rebound|board/.test(s)?'reb':/assist|dime/.test(s)?'ast':/three|3 ?point|3pm|trey/.test(s)?'tpm':/point|scor/.test(s)?'pts':null;
    const list=pickN(safePool().filter(x=>!cat||x.s===cat),Math.min(10,n),2);if(!list.length){say(LINES.st==='ok'&&!Object.values(LINES.posted).some(Boolean)?'Apps have not posted player lines for '+dayLabel(DAY).toLowerCase()+' yet, so there is nothing real to build from. Pick another day up top.':'I could not find enough steady legs for that. Try another stat or day.');return}
    S.cart=list.map(legClean);save();refreshSlip();renderView();const r=rate(S.cart);say(`Done: ${list.length} legs, ${r.score}% to hit all. ${list.map(x=>short(x.n)+' '+x.bar+'+ '+STS[x.s]).join(', ')}.`);return}
  const p=findByName(t.replace(/\b(how|is|does|about|tonight|today|what|who|the|best)\b/gi,' ').trim());
  if(p){const parts=CATS.map(c=>{const v=(p[c]||[]).slice(0,10);return v.length?STS[c]+' '+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):''}).filter(Boolean);say(`${p.n} over his last 10: ${parts.join(', ')}.${p.inj?' Injury: '+p.inj.t:''}`);return}
  say('Try "build me 4 legs", "only rebounds", "rate my slip", or ask about a player by name.')}
function palSend(t){t=String(t||'').trim();if(!t||PALBUSY)return;const hist=CHAT.slice(-10).map(m=>({r:m.r,t:m.t}));say(t,'u');PALBUSY=true;renderChat();
  let ctx;try{ctx=palCtx()}catch(e){ctx={}}
  const fin=fn=>{PALBUSY=false;try{fn()}catch(e){say('Something went wrong on my side. Try saying it another way.')}};
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,history:hist,context:ctx})}).then(r=>r.json()).then(j=>fin(()=>{
    if(!j||j.configured===false||j.error||!j.reply){palLocal(t);return}palApply(j.actions);say(j.reply)})).catch(()=>fin(()=>palLocal(t)))}
function togglePal(force){const open=force!=null?force:$('palp').hidden;$('palp').hidden=!open;document.querySelector('.paltab').setAttribute('aria-expanded',String(open));if(open){renderChat();if(!RM&&HAS_G)gsap.fromTo('#palp',{y:24,opacity:0,scale:.98},{y:0,opacity:1,scale:1,duration:.4,ease:'power3.out'});setTimeout(()=>$('palin').focus(),60)}}

const SO={tab:'new',posts:[],busy:false,err:'',lead:null,open:{},cm:{},text:'',img:'',att:false,prof:null};
const soApi=(p,b)=>api('/api/social/'+p,b);
function soAgo(t){const s=Math.max(1,Math.floor(Date.now()/1000-t));return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':s<604800?Math.floor(s/86400)+'d':new Date(t*1000).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
const recHtml=r=>r&&(r.w||r.l)?`<span class="rec ${r.w>r.l?'up':r.l>r.w?'dn':''}">${r.w}-${r.l}</span>`:'';
function ticket(p){const n=p.legs.length,tot=p.odds||(p.legs.every(l=>l.o)?toAm(p.legs.reduce((m,l)=>m*dec(l.o),1)):''),pay=p.payout?+p.payout:(p.stake&&tot?Math.round(+p.stake*dec(+tot)*100)/100:0),st=p.res==='hit'?'Winner':p.res==='miss'?'Lost':p.res==='void'?'Void':'Open';
  return`<div class="tkt ${p.res||''}"><div class="tkh"><b>${n}-leg parlay${p.app?' · '+esc(p.app):p.legs.some(l=>l.est)?' · Pal estimate':''}</b><em class="num">${tot?am(+tot):''}</em></div>${p.legs.map(l=>`<div class="tkl">${hs(l.n,l.pid)}<div><b>${esc(l.n)}</b><span>${l.bar}+ ${esc(ST[l.s]||l.s)}${l.v!=null?' · '+l.v+' of '+l.bar:''}</span></div><i class="${l.res||''}">${l.res==='hit'?'Hit':l.res==='miss'?'Miss':l.res==='void'?'DNP':l.o?am(l.o):'Open'}</i></div>`).join('')}
    <div class="tkf"><div><small>Wager</small><b class="num">${p.stake?'$'+esc(p.stake):'–'}</b></div><div><small>${p.res==='hit'?'Paid':'To pay'}</small><b class="num" style="color:${p.res==='hit'?'var(--lime)':''}">${pay?'$'+pay:'–'}</b></div><span class="tst ${p.res==='hit'?'hit':p.res==='miss'?'miss':''}" style="margin-left:auto">${st}</span></div></div>`}
function postHtml(p){const a=p.by,c=a.color||'var(--pur)';

  else if(a==='sharepost'){if(!ACCT){openAuth('up');return}SO.att=true;SO.prof=null;go('social')}
  else if(a==='sheetx')closeSheet();
  else if(a==='ps'){PS.s=d.s;PS.bar=null;renderPlayer()}
  else if(a==='pf'){PS.f=d.f;renderPlayer()}
  else if(a==='pstep')pstep(+d.d);
  else if(a==='padd')padd();
  else if(a==='pal')togglePal();
  else if(a==='sugg')palSend(t.textContent);
  else if(a==='acct')openAuth();
  else if(a==='auth')openAuth(d.m||'in');
  else if(a==='mclose')$('modal').hidden=true;
  else if(a==='logout'){api('/api/auth/logout',{}).finally(()=>{ACCT=null;$('modal').hidden=true;renderMe();toast('Signed out.');if(VIEW==='social')renderSocial()})}
  else if(a==='myprof'){$('modal').hidden=true;if(ACCT)soProfile(ACCT.id)}
  else if(a==='stab'){SO.tab=d.t;soLoad()}
  else if(a==='sreload')soLoad();
  else if(a==='satt'){const x=$('sotx');if(x)SO.text=x.value;SO.att=!SO.att;if(SO.att)oddsKick();renderSocial()}
  else if(a==='spost'){if(!ACCT){openAuth('up');return}soPost()}
  else if(a==='slike'){if(!ACCT){openAuth('up');return}const p=soFind(d.id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;soRedraw(d.id);soApi('like',{id:+d.id}).then(j=>{p.liked=j.liked;p.likes=j.likes;soRedraw(d.id)}).catch(x=>toast(x.message))}
  else if(a==='scm'){SO.open[d.id]=!SO.open[d.id];soRedraw(d.id);if(SO.open[d.id])soApi('comments?id='+d.id).then(j=>{SO.cm[d.id]=j.comments||[];soRedraw(d.id)}).catch(x=>toast(x.message))}
  else if(a==='sshare'){const u=location.origin+'/v2#social';if(navigator.share)navigator.share({title:'Parlay Pal',url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast('Link copied.')}catch(x){toast(u)}}}
  else if(a==='stail')soTail(d.id);
  else if(a==='sdel'){if(!confirm('Delete this post?'))return;soApi('delete',{id:+d.id}).then(()=>{SO.posts=SO.posts.filter(p=>p.id!==+d.id);document.querySelectorAll(`.post[data-id="${d.id}"]`).forEach(x=>x.remove());toast('Deleted.')}).catch(x=>toast(x.message))}
  else if(a==='sprof')soProfile(d.u);
  else if(a==='sback'){SO.prof=null;soLoad()}
  else if(a==='sfollow'){if(!ACCT){openAuth('up');return}soApi('follow',{uid:+d.u}).then(j=>{const u=SO.prof&&SO.prof.user;if(u){u.iFollow=j.following;u.followers+=j.following?1:-1;renderSocial()}}).catch(x=>toast(x.message))}
});
document.addEventListener('submit',e=>{const f=e.target;if(f.id==='palf'){e.preventDefault();const i=$('palin');palSend(i.value);i.value=''}
  else if(f.id==='authf'){e.preventDefault();authSubmit(f)}
  else if(f.classList.contains('cmf')){e.preventDefault();const i=f.querySelector('input'),id=f.dataset.id,v=i.value.trim();if(!v)return;i.disabled=true;soApi('comment',{id:+id,text:v}).then(()=>{const p=soFind(id);if(p)p.comments++;return soApi('comments?id='+id)}).then(j=>{SO.cm[id]=j.comments||[];soRedraw(id)}).catch(x=>{toast(x.message);i.disabled=false})}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q')searchRun(t.value);else if(t.id==='stake'){S.stake=t.value.replace(/[^0-9.]/g,'');save();const b=$('books');if(b)b.innerHTML=booksHtml()}else if(t.id==='sotx')SO.text=t.value});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='plat'){S.pl=t.value;save()}else if(t.id==='sofile'){soPhoto(t.files[0]);t.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('sheet').hidden)closeSheet();else if(!$('modal').hidden)$('modal').hidden=true;else if(!$('palp').hidden)togglePal(false);$('qres').hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.srch'))$('qres').hidden=true});

motionInit();renderMe();renderChat();renderDock();
go((location.hash||'').slice(1)||'tonight',true);
loadDay('');acctLoad();pollLive();
window.__pp2={S,cands:()=>cands(),five,rate};
})();
