# Runs the account checks against a real Postgres database whenever the account code changes.
name: Account checks
on:
  workflow_dispatch:
  push:
    paths: ["auth.py", "tests/auth_check.py", ".github/workflows/auth-check.yml"]
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: parlaypal }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Account checks on Postgres
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/parlaypal
          PG_NO_SSL: "1"
        run: |
          python tests/auth_check.py | tee out.txt
          while read -r line; do echo "::notice title=pg::$line"; done < out.txt
          grep -q "ALL PASSED" out.txt
